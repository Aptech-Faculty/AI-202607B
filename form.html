<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
</head>
<body>
    <center>
        <div>
            <h1>User Form</h1>
            <form action="">
                <input type="button" value="User Submit">
                <input type="checkbox">
                <input type="color">
                <input type="date">
                <input type="datetime">
                <input type="datetime-local">
                <input type="email" placeholder="Enter Your Name" value="Muhammad Usaid" required>
                <input type="file">
                <input type="hidden">                
                <input type="image">
                <input type="month">
                <input type="number">
                <input type="password">
                <input type="radio">
                <input type="range">
                <input type="reset">
                <input type="search">
                <input type="submit">
                <input type="tel">
                <input type="text">
                <input type="time">
                <input type="url">
                <input type="week">
                <textarea placeholder="Message" rows="5" cols="50"></textarea>
                <select>
                    <option value="Select Your Country" selected disabled>Select Your Country</option>
                    <option value="Pakistan">Pakistan</option>
                    <option value="Iran">Iran</option>
                    <option value="China">China</option>
                </select>
            </form>
        </div>
    </center>
</body>
</html>
